openapi: 3.0.0
info:
  title: User API
  version: 1.0.0
  description: API documentation for user management operations.
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /login:
    post:
      summary: User login
      description: Authenticates a user and returns a token.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: johndoe@example.com
                password:
                  type: string
                  example: Password123
      responses:
        '200':
          description: Login successful, token returned.
        '401':
          description: Invalid credentials.
  /pending:
    get:
      summary: Fetch pending users
      description: Fetch a list of users pending approval. Admin-only access.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of pending users.
        '403':
          description: Forbidden. Admin access required.
        '401':
          description: Unauthorized. Token is invalid or missing.
  /approve:
    post:
      summary: Approve a pending user
      description: Approves a user. Admin-only access.
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "varun.subramania@gmail.com"
      responses:
        '200':
          description: User successfully approved.
        '403':
          description: Forbidden. Admin access required.
        '401':
          description: Unauthorized. Token is invalid or missing.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
